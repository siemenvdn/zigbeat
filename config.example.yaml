# zigbeat configuration. Copy to config.yaml and adjust.
# These names match cmd/fake-z2m; use your Zigbee2MQTT friendly names instead.

mqtt:
  broker: 127.0.0.1:1883
  username: zigbeat
  password_env: ZIGBEAT_MQTT_PASSWORD
  base_topic: zigbee2mqtt

budget:
  max_rate: 4          # Zigbee frames per second: the budget zigbeat probe suggested
  latency_ms: 105      # p50 latency zigbeat probe reported at that load
  audio_offset_ms: 0   # positive when the speakers play later; -500 to 2000, calibrate in zigbeat run

# music_assistant:              # the beat source; without it the show runs to a metronome
#   url: ws://127.0.0.1:8095    # Music Assistant's webserver
#   token_env: ZIGBEAT_MA_TOKEN # a long-lived token created in Music Assistant
#   player: ""                  # optional MA player id; empty follows whichever player is playing

canary: far-lamp       # optional: a mains-powered device far from the lights

fixtures:
  - name: pendant
    role: color
    mode: alternate    # alternate (default), separate or together
    lights: [lamp-1, lamp-2, lamp-3]
  - name: floor-lamp
    role: breathe
    lights: [lamp-4]

effects:
  cadence: 2s                # minimum time between moments
  brightness: 60             # percent, base level of color lights
  breathe_range: [30, 80]    # percent
  album_palette: true        # the colours of the album art when Music Assistant has them; false keeps the palette
  album_colors: 3            # colours made from the album art, 2 to 6
  variant: rotation          # rotation (build, then walk, shuffle and swap per 16 bars), walk, shuffle, swap or build
  # palette: ["#ff2a6d", "#ff7b00", "#ffd400", "#00e5ff", "#2962ff", "#aa00ff"]
